name: Deploy Hugo site

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.162.1'
          extended: true

      - name: Build
        working-directory: hugo-site
        run: hugo --cleanDestinationDir --minify

      - name: Debug - verify build output
        id: debug
        working-directory: hugo-site
        env:
          HUGO_CACHEDIR: /tmp/hugo_cache
        run: |
          echo "Hugo: $(hugo version)"
          echo "Commit: $(git rev-parse HEAD | cut -c1-7)" || true
          SERIES_COUNT=$(hugo list all 2>/dev/null | grep ',series,' | wc -l) || SERIES_COUNT=0
          echo "Total series pages: $SERIES_COUNT"
          echo "  information-judgment: $(hugo list all 2>/dev/null | grep 'information-judgment' | wc -l)"
          echo "  chan-shi-lu: $(hugo list all 2>/dev/null | grep 'chan-shi-lu' | wc -l)"
          echo "  confucian-framework: $(hugo list all 2>/dev/null | grep 'confucian-framework' | wc -l)"
          echo "  ai-bu-yin: $(hugo list all 2>/dev/null | grep 'ai-bu-yin' | wc -l)"
          echo "  yi-notes: $(hugo list all 2>/dev/null | grep 'yi-notes' | wc -l)"
          echo "IJ index.html: $(wc -c < public/series/information-judgment/index.html 2>/dev/null || echo 0) bytes"
          echo "Total HTML: $(find public -name '*.html' | wc -l)"
          echo "IJ paginated pages: $(ls public/series/information-judgment/page/ 2>/dev/null | grep -v '1$' | wc -l)"
          echo "DEBUG_DONE=true"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: hugo-site/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          buildtype: legacy