name: Deploy Hugo site

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.147.4'
          extended: true

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build
        working-directory: hugo-site
        run: hugo --cleanDestinationDir --minify

      - name: Debug - verify build output
        working-directory: hugo-site
        run: |
          echo "=== Hugo version ===" && hugo version
          echo "=== uglyURLs config ===" && grep uglyURLs hugo.toml
          echo "=== Series directory ===" && ls public/series/ | head -20
          echo "=== HTML taxonomy pages ===" && ls public/series/*.html 2>/dev/null || echo "(none)"
          echo "=== Posts with series frontmatter ===" && grep -r "^series:" content/posts/ | wc -l
          echo "=== Section page article counts ===" && for d in public/series/*/; do if [ -f "${d}index.html" ]; then count=$(grep -c 'post-entry\|entry-hint' "${d}index.html" 2>/dev/null || echo 0); echo "$(basename $d): $count articles"; fi; done

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: hugo-site/public

  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4