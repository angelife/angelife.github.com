name: Deploy Hugo site

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.162.1'
          extended: true

      - name: Build
        working-directory: hugo-site
        run: hugo --cleanDestinationDir --minify

      - name: Debug - verify build output
        id: debug
        working-directory: hugo-site
        env:
          HUGO_CACHEDIR: /tmp/hugo_cache
        run: |
          echo "=== ENVIRONMENT ==="
          echo "Hugo: $(hugo version)"
          echo "Commit: $(git rev-parse HEAD)"
          echo ""
          echo "=== TAXONOMY PAGE COUNTS (hugo list all) ==="
          hugo list all 2>/dev/null | grep ',series,' | wc -l | xargs echo "Total series pages:"
          hugo list all 2>/dev/null | grep ',series,' | grep 'information-judgment' | wc -l | xargs echo "  information-judgment articles:"
          hugo list all 2>/dev/null | grep ',series,' | grep 'chan-shi-lu' | wc -l | xargs echo "  chan-shi-lu articles:"
          hugo list all 2>/dev/null | grep ',series,' | grep 'confucian-framework' | wc -l | xargs echo "  confucian-framework articles:"
          hugo list all 2>/dev/null | grep ',series,' | grep 'ai-bu-yin' | wc -l | xargs echo "  ai-bu-yin articles:"
          hugo list all 2>/dev/null | grep ',series,' | grep 'yi-notes' | wc -l | xargs echo "  yi-notes articles:"
          echo ""
          echo "=== TAXONOMY INDEX HTML SIZES ==="
          wc -c public/series/information-judgment/index.html 2>/dev/null || echo "  information-judgment/index.html: NOT FOUND"
          wc -c public/series/chan-shi-lu/index.html 2>/dev/null || echo "  chan-shi-lu/index.html: NOT FOUND"
          echo ""
          echo "=== SERIES DIRECTORY FILES ==="
          find content/series -name '*.md' | wc -l | xargs echo "  Total series .md files:"
          for s in information-judgment chan-shi-lu confucian-framework ai-bu-yin yi-notes; do
            count=$(find "content/series/$s" -name '*.md' 2>/dev/null | wc -l)
            echo "    $s: $count files"
          done
          echo ""
          echo "=== BUILD STATS ==="
          find public -name '*.html' | wc -l | xargs echo "  Total HTML files:"
          ls public/series/information-judgment/page/ 2>/dev/null | grep -v '1$' | wc -l | xargs echo "  information-judgment paginated pages:"
          echo "=== WRITING DIAGNOSTIC PAGE ==="
          python3 scripts/write_ci_diagnostic.py
          echo "Diagnostic page written."

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: hugo-site/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          buildtype: legacy