<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">AI 原生知识生产线</title>
  <desc id="desc">从旧材料进入 Inbox，经过 AI 初炼、Obsidian 沉淀、发布稿成熟、Hugo 发布和 Git 备份。</desc>
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0" stop-color="#0B1D3A"/>
      <stop offset=".55" stop-color="#1E5BFF"/>
      <stop offset="1" stop-color="#0FA3A3"/>
    </linearGradient>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#0B1D3A}
      .box{fill:#fff;stroke:#D7DEE9;stroke-width:2}
      .num{fill:#0B1D3A;font-weight:700;font-size:28px}
      .label{font-weight:700;font-size:24px}
      .note{fill:#536179;font-size:16px}
      .arrow{stroke:url(#g);stroke-width:4;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#0FA3A3"/>
    </marker>
  </defs>
  <rect width="1200" height="360" fill="#FBFCFF"/>
  <text x="60" y="62" font-size="34" font-weight="700">AI 原生知识生产线</text>
  <text x="60" y="96" class="note">所有材料先进 Inbox，所有整理先过 AI，所有知识沉入 Obsidian，所有成熟内容发到 Hugo。</text>
  <g transform="translate(60 145)">
    <rect class="box" x="0" y="0" width="160" height="120" rx="8"/>
    <text class="num" x="24" y="42">00</text>
    <text class="label" x="24" y="75">Inbox</text>
    <text class="note" x="24" y="101">原始材料</text>
    <path class="arrow" d="M175 60H245"/>
    <rect class="box" x="260" y="0" width="160" height="120" rx="8"/>
    <text class="num" x="284" y="42">AI</text>
    <text class="label" x="284" y="75">初炼</text>
    <text class="note" x="284" y="101">分类摘要标签</text>
    <path class="arrow" d="M435 60H505"/>
    <rect class="box" x="520" y="0" width="160" height="120" rx="8"/>
    <text class="num" x="544" y="42">库</text>
    <text class="label" x="544" y="75">Obsidian</text>
    <text class="note" x="544" y="101">长期沉淀</text>
    <path class="arrow" d="M695 60H765"/>
    <rect class="box" x="780" y="0" width="160" height="120" rx="8"/>
    <text class="num" x="804" y="42">稿</text>
    <text class="label" x="804" y="75">发布稿</text>
    <text class="note" x="804" y="101">成熟成文</text>
    <path class="arrow" d="M955 60H1025"/>
    <rect class="box" x="1040" y="0" width="160" height="120" rx="8"/>
    <text class="num" x="1064" y="42">站</text>
    <text class="label" x="1064" y="75">Hugo + Git</text>
    <text class="note" x="1064" y="101">发布与备份</text>
  </g>
</svg>
