{{ define "main" }}
<section class="home-page simple-home" aria-label="angelife home">
  <div class="simple-header">
    <h1>精于心，简于形</h1>
    <p class="simple-subtitle">angelife / 安知生</p>
  </div>

  <div class="simple-content">
    <div class="simple-section">
      <h2>栏目</h2>
      <ul class="simple-links">
        <li><a href="/series/information-judgment/">金·判断</a></li>
        <li><a href="/series/chan-shi-lu/">木·蝉识</a></li>
        <li><a href="/series/yi-notes/">水·易理</a></li>
        <li><a href="/series/ai-bu-yin/">火·AI</a></li>
        <li><a href="/series/confucian-framework/">土·正见</a></li>
        <li><a href="/series/anti-populism/">反民粹</a></li>
      </ul>
    </div>

    <div class="simple-section">
      <h2>最新文章</h2>
      <ul class="simple-posts">
        {{ range first 10 (where site.RegularPages "Section" "posts") }}
        <li><a href="{{ .RelPermalink }}">{{ .Title }}</a></li>
        {{ end }}
      </ul>
    </div>

    <div class="simple-section">
      <h2>链接</h2>
      <ul class="simple-links">
        <li><a href="/about/">关于</a></li>
        <li><a href="/changelog/">更新记录</a></li>
        <li><a href="/kindle/">Kindle版</a></li>
        <li><a href="/search/">搜索</a></li>
      </ul>
    </div>
  </div>
</section>
{{ end }}
