{{- define "main" }}

<header class="page-header">
  <h1>{{- (printf "%s&nbsp;" .Title ) | htmlUnescape -}}
    <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none"
      stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"></circle>
      <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
    </svg>
  </h1>
  {{- if .Description }}
  <div class="post-description">
    {{ .Description }}
  </div>
  {{- end }}
  {{- if not (.Param "hideMeta") }}
  <div class="post-meta">
    {{- partial "translation_list.html" . -}}
  </div>
  {{- end }}
</header>

<div id="searchbox">
  <input id="searchInput" autofocus placeholder="{{ .Params.placeholder | default (printf "%s ↵" .Title) }}"
    aria-label="search" type="search" autocomplete="off" maxlength="64">
  <ul id="searchResults" aria-label="search results"></ul>
</div>

<script>
(() => {
  const input = document.getElementById("searchInput");
  const results = document.getElementById("searchResults");
  if (!input || !results) return;

  const normalize = (value) => (value || "").toLowerCase().replace(/\s+/g, "");
  const stripHtml = (value) => (value || "").replace(/<[^>]*>/g, "").replace(/\s+/g, " ").trim();
  const escapeHtml = (value) => stripHtml(value).replace(/[&<>"']/g, (char) => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    "\"": "&quot;",
    "'": "&#39;"
  }[char]));

  let pages = [];

  const render = (query) => {
    const needle = normalize(query);
    if (!needle) {
      results.innerHTML = "";
      return;
    }

    const matches = pages
      .map((page) => {
        const title = normalize(page.title);
        const tags = normalize(page.tags);
        const categories = normalize(page.categories);
        const summary = normalize(page.summary);
        const content = normalize(page.content);
        const haystack = `${title} ${tags} ${categories} ${summary} ${content}`;

        if (!haystack.includes(needle)) return null;

        let score = 0;
        if (title.includes(needle)) score += 6;
        if (tags.includes(needle)) score += 4;
        if (categories.includes(needle)) score += 4;
        if (summary.includes(needle)) score += 2;
        if (content.includes(needle)) score += 1;

        return { page, score };
      })
      .filter(Boolean)
      .sort((a, b) => b.score - a.score)
      .slice(0, 12);

    results.innerHTML = matches.map(({ page }) => {
      const summary = escapeHtml(page.summary || page.content).slice(0, 120);
      return `<li class="post-entry search-entry">
        <header class="entry-header"><h2><a href="${page.permalink}">${escapeHtml(page.title)}</a></h2></header>
        ${summary ? `<div class="entry-content"><p>${summary}</p></div>` : ""}
      </li>`;
    }).join("");
  };

  fetch("/index.json")
    .then((response) => response.json())
    .then((data) => {
      pages = Array.isArray(data) ? data : [];
      render(input.value);
    })
    .catch(() => {
      results.innerHTML = "";
    });

  input.addEventListener("input", () => render(input.value));
  input.addEventListener("keyup", () => render(input.value));
})();
</script>

{{- end }}{{/* end main */}}
