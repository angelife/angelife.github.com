.single, article {

  padding: 0 20px;
}

/* —— 首页 footer 样式 —— */

}

/* —— 首页极简毛笔风 —— */

.post-category {

}
.section-subtitle {

  color: #999;
  font-size: 14px;
  margin: 0 0 36px 0;
  line-height: 1.7;
  max-width: 760px;
  margin-left: auto;
  margin-right: auto;
}
.archive .article-title {
  margin-bottom: 8px !important;
}

/* —— 主题色变量锁定 —— */
:root,
html[data-theme="light"],
html[data-theme="dark"],
html:not([data-theme]) {
  --c-bg: #FAFAF7 !important;
  --c-text: #1a1a1a !important;
  --c-link: #1a1a1a !important;
  --c-heading: #1a1a1a !important;
  --c-heading-border: #ECECEA !important;
  --c-border: #ECECEA !important;
  --c-border-soft: #F0EFEC !important;
  --c-muted: #4a4a52 !important;
  --c-muted-2: #999999 !important;
  --c-subtitle: #4a4a52 !important;
  --c-hr: #ECECEA !important;
  --c-panel: #f7f7f7 !important;
  --c-pre-bg: #f7f7f7 !important;
  --c-inline-code-bg: #f7f7f7 !important;
  --c-quote-text: #777 !important;
  --c-quote-bg: transparent !important;
  --c-quote-border: #ddd !important;
  --c-code-text: #4d4d4c !important;

  /* naosense 风格：代码块外观 */
  --syn-comment: #8e908c;
  --syn-keyword: #8959a8;
  --syn-string: #718c00;
  --syn-number: #f5871f;
  --syn-func: #4271ae;
  --syn-type: #f5871f;
  --syn-ident: #4d4d4c;
  --syn-var: #c82829;
  --syn-tag: #c82829;
  --syn-punct: #4d4d4c;
  --syn-error: #c82829;
  --c-archive-hover: #1a1a1a !important;
}
/* 容器底色强制 */
.container,
.container.container-post,
main,
.main,
article,
.post,
.page,
.s3g-banner,
.s3g-footer,
.archive {
  background: #FAFAF7 !important;
}
/* 暗色模式偏好下也强制亮色 */
@media (prefers-color-scheme: dark) {
  :root, html, html[data-theme="dark"] {
    --c-bg: #FAFAF7 !important;
    --c-text: #1a1a1a !important;
    color-scheme: light !important;
  }
  html, body, .container { background: #FAFAF7 !important; color: #1a1a1a !important; }
}

/* —— 暖纸感色板 —— */
:root {
  --al-bg: #FAFAF7;
  --al-ink: #1a1a1a;
  --al-ink-soft: #222222;
  --al-mute: #ACACAC;
  --al-mute-deep: #9C9C9C;
  --al-slogan: #3F3C37;
  --al-line: #ECECEA;
}
html, body {
  background: #FAFAF7 !important;
  color: #1a1a1a !important;
}

/* —— 页脚分隔线 —— */
.s3g-footer {
  border-top: 1px solid #ECECEA !important;
  background: transparent !important;
}

/* —— 封面图块 —— */
.post-cover {
  margin: 1.6em auto 1.4em;
  max-width: 100%;
  text-align: center;
}
.post-cover img {
  display: block;
  margin: 0 auto;
  max-width: 100%;
  max-height: 280px;
  width: auto;
  height: auto;
  object-fit: cover;
  border-radius: 2px;
  background: #ECECEA;
}
.post-cover figcaption {
  margin-top: 0.6em;
  font-size: 13px;
  color: #999999;
  font-style: italic;
  letter-spacing: 0.02em;
}

/* —— Header 毛玻璃（粘性导航预留） —— */
.s3g-banner.sticky {
  position: sticky;
  top: 0;
  background: rgba(250, 250, 248, 0.88);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  z-index: 10;
}

/* —— 搜索页 —— */
.search-page {
  max-width: 820px !important;
  margin: 0 auto;
  padding: 0 20px;
}
.search-page .article-title {
  font-size: 32px;
  font-weight: 700;

}
.search-box {
  margin-top: 24px;
}
.search-box #search-input {

  font-size: 18px;

  color: var(--c-text, #1a1a1a);
  border: 1px solid #ECECEA;
  border-radius: 2px;
  outline: none;
  transition: border-color 0.2s;
  box-sizing: border-box;
  font-family: inherit;
}
.search-box #search-input:focus {

}
.search-box #search-input::placeholder {

}
.search-box #results {

  font-size: 16px;
}

/* —— 代码块直接覆盖（naosense 风格：#f7f7f7 + #ccc 边框）—— */
.highlight,
.post .highlight,
.post .highlight pre,
.post .highlight pre.chroma {

}
.post .highlight pre.chroma {

}

.post .highlight .chroma .lntd:first-child,
.post .highlight .chroma .ln {

}

}
/* 代码文字色 */
.post .highlight,
.post .highlight pre,
.post .highlight pre.chroma code {

}

.post code {

.post blockquote {

}
