  url = "/series/chan-shi-lu/"
  weight = 20

[[menu.main]]
  identifier = "phase-water"
  name = "水·易理"
  url = "/series/yi-notes/"
  weight = 30

[[menu.main]]
  identifier = "phase-fire"
  name = "火·AI"
  url = "/series/ai-bu-yin/"
  weight = 40

[[menu.main]]
  identifier = "phase-earth"
  name = "土·正见"
  url = "/series/confucian-framework/"
  weight = 50

[[menu.main]]
  identifier = "daily"
  name = "日课"
  url = "/categories/日课/"
  weight = 60

[[menu.main]]
  identifier = "search"
  name = "搜索"
  url = "/search/"
  weight = 70

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[permalinks]
  posts = "/posts/:slug/"
