baseURL = "https://angelife.github.io/"
languageCode = "zh-cn"
title = "安知生 angelife"
theme = "PaperMod"
copyright = "© 2009–2026 angelife / 安知生"

enableRobotsTXT = true
hasCJKLanguage = true
summaryLength = 120

[outputs]
  home = ["HTML", "RSS", "JSON"]

[params]
  defaultTheme = "light"
  ShowReadingTime = true
  ShowBreadCrumbs = true
  ShowPostNavLinks = true
  ShowCodeCopyButtons = true
  DateFormat = "2006-01-02"
  mainSections = ["series", "posts"]

  [params.fuseOpts]
    keys = ["title", "permalink", "summary", "content", "tags", "categories"]
    threshold = 0.4
    ignoreLocation = true

[[menu.main]]
  identifier = "phase-metal"
  name = "金·判断"
  url = "/series/information-judgment/"
  weight = 10

[[menu.main]]
