baseURL = "https://angelife.github.io/"
languageCode = "zh-cn"
title = "安知生 angelife"
theme = "polk-x"
copyright = "© 2009–2026 angelife / 安知生"

mainSections = ["columns", "posts", "series"]

enableRobotsTXT = true
hasCJKLanguage = true
summaryLength = 120
buildFuture = true

disablePathToLower = true

[frontmatter]
  categories = "keep"
  series = "keep"

[taxonomies]
  series = "series"
  categories = "categories"
  tags = "tags"

[outputs]
  home = ["HTML", "RSS", "JSON"]

[outputFormats]
  [outputFormats.Kindle]
    mediaType = "text/html"
    path = "kindle"
    baseName = "index"
    isHTML = true
    permalinkable = true
    noUgly = true

[params]
  defaultTheme = "light"
  ShowBreadCrumbs = false
  ShowPostNavLinks = false
  ShowCodeCopyButtons = false
  ShowReadingTime = false
  DateFormat = "2006-01-02"

  [params.fuseOpts]
    keys = ["title", "permalink", "summary", "content", "tags", "categories"]
    threshold = 0.4
    ignoreLocation = true

  [params.giscus]
    enabled = false
    repo = "angelife/angelife.github.com"
    repoId = ""
    category = "General"
    categoryId = ""
    mapping = "pathname"
    strict = "0"
    reactionsEnabled = "1"
    emitMetadata = "0"
    inputPosition = "bottom"
    theme = "preferred_color_scheme"
    lang = "zh-CN"
    loading = "lazy"

# Menu removed — homepage is a garden entry, not a blog
# Five-element navigation is in the homepage template
# Footer has minimal links (archives, search, about)

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[permalinks]
  posts = "/posts/:slug/"
