baseURL = "https://angelife.github.io/"
languageCode = "zh-cn"
title = "安知生 angelife"
theme = "PaperMod"
copyright = "© 2009–2026 angelife / 安知生"

enableRobotsTXT = true
hasCJKLanguage = true
summaryLength = 120
buildFuture = true

disablePathToLower = true

[taxonomies]
  series = "series"
  categories = "categories"
  tags = "tags"

[outputs]
  home = ["HTML", "RSS", "JSON"]

[outputFormats]
  [outputFormats.Kindle]
    mediaType = "text/html"
    path = "kindle"
    baseName = "index"
    isHTML = true
    permalinkable = true
    noUgly = true

[params]
  defaultTheme = "light"
  ShowReadingTime = true
  ShowBreadCrumbs = true
  ShowPostNavLinks = true
  ShowCodeCopyButtons = true
  DateFormat = "2006-01-02"
  mainSections = ["columns", "posts", "series"]

  [params.fuseOpts]
    keys = ["title", "permalink", "summary", "content", "tags", "categories"]
    threshold = 0.4
    ignoreLocation = true

  [params.giscus]
    enabled = false
    repo = "angelife/angelife.github.com"
    repoId = ""
    category = "General"
    categoryId = ""
    mapping = "pathname"
    strict = "0"
    reactionsEnabled = "1"
    emitMetadata = "0"
    inputPosition = "bottom"
    theme = "preferred_color_scheme"
    lang = "zh-CN"
    loading = "lazy"

